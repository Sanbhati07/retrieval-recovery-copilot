name: Build real photo corpus (Wikimedia Commons)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Number of real photographs to build'
        required: true
        default: '1000'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CORPUS_TARGET: ${{ inputs.target }}
      CORPUS_VERSION: v4
      COMMONS_SEARCH_LIMIT: '50'
      COMMONS_MAX_OFFSETS_PER_QUERY: '4'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build real photo corpus
        run: npm run corpus:build

      - name: Upload corpus manifest
        uses: actions/upload-artifact@v4
        with:
          name: real-corpus-manifest-v4
          path: data/real-corpus/manifest-v4.json
