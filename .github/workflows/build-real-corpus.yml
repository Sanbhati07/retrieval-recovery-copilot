name: Build real photo corpus

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Number of real photographs to build'
        required: true
        default: '1000'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CORPUS_TARGET: ${{ inputs.target }}
      CORPUS_VERSION: v3
      OPENVERSE_PAGE_SIZE: '50'
      OPENVERSE_MAX_PAGES: '6'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run corpus:build
      - uses: actions/upload-artifact@v4
        with:
          name: real-corpus-manifest
          path: data/real-corpus/manifest-v3.json
